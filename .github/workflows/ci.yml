name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch cancels the run that is already going, because there
# is no point burning runners on a commit nobody is looking at any more.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

# Windows runners default to PowerShell, which splits an argument like
# -coverprofile=coverage.out in a way that hands go test a package named
# ".out". Using bash everywhere means one command that behaves the same on all
# four runners rather than a Windows special case in every step.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: go build ./...

      # -shuffle=on catches tests that pass only because of the order they run
      # in, which is the kind of thing that stays hidden until it fails in
      # someone else's pull request.
      - name: Test
        run: go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          {
            echo '### Coverage'
            echo '```'
            tail -1 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # The whole library has to build, test and be usable with no experiment flag
  # set. That is what makes it safe to depend on an unstable package at all, so
  # it is checked on every commit rather than nightly.
  simd:
    name: simd (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    env:
      GOEXPERIMENT: simd
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build with simd
        run: go build ./...

      - name: Test with simd
        run: go test -race ./...

  # The arrow-go bridge is its own module, so the root ./... does not reach it
  # and it needs a job of its own to be built and tested at all. It is the only
  # part of the repository with a dependency, which is the reason it is a
  # separate module and the reason this job exists.
  arrowgo:
    name: arrowgo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: arrowgo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: arrowgo/go.mod
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -shuffle=on ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy is a no-op
        if: matrix.os == 'ubuntu-latest'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  # The C data interface is an agreement with other libraries, so it is checked
  # against one. pyarrow and kuma end up in the same process and hand columns
  # to each other in both directions, and the test compares buffer addresses,
  # which is the only way to see that nothing was copied.
  pyarrow:
    name: pyarrow cross check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pyarrow
        run: pip install --disable-pip-version-check pyarrow

      # The test skips itself when pyarrow is not importable, which is right on
      # a laptop and wrong here. This step fails the job instead, so that a
      # broken install shows up as a broken install rather than as a check that
      # quietly stopped running.
      - name: pyarrow is importable
        run: python -c "import pyarrow; print(pyarrow.__version__)"

      - name: Cross check
        run: go test -v -run TestPyarrow ./ipc/

  vet:
    name: vet and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: go vet
        run: go vet ./...

      # ./... does not reach into testdata, and the pyarrow cross check lives
      # there because it is a main package nothing imports. It still has to be
      # held to the same standard as the rest.
      - name: go vet the cross check
        run: go vet ./ipc/testdata/pyarrow

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy is a no-op
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # Doc comment completeness is enforced by revive in the lint workflow.
      # This step only checks that godoc can render the packages at all, which
      # catches malformed example functions and broken links early.
      # go doc takes one package at a time, so this is a loop rather than the
      # ./... you would expect.
      - name: godoc renders
        run: |
          for pkg in $(go list ./...); do
            go doc -all "$pkg" > /dev/null
          done

  # The targets are asked for rather than written down, the same way the
  # nightly workflow asks, so that a package that grows a fuzz target gets it
  # run without anybody remembering to come here.
  fuzz-targets:
    name: list fuzz targets
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: List them
        id: list
        run: |
          out=""
          for pkg in $(go list ./...); do
            for target in $(go test -list='Fuzz.*' "$pkg" 2>/dev/null | grep '^Fuzz' || true); do
              dir=".${pkg#github.com/tamnd/kuma}"
              out="$out{\"pkg\":\"$dir\",\"name\":\"$target\"},"
            done
          done
          echo "list=[${out%,}]" >> "$GITHUB_OUTPUT"

  # A short run on every pull request, to catch anything the committed corpus
  # already covers. The long run is nightly.
  #
  # One job per target rather than a loop over all of them. The loop was 30
  # seconds times however many targets exist, which reached eleven minutes and
  # was most of the wall clock of a pull request on its own. Side by side it is
  # thirty seconds of fuzzing plus the time it takes to check out and build,
  # and it stays that way as targets are added.
  fuzz:
    name: fuzz smoke (${{ matrix.target.pkg }} ${{ matrix.target.name }})
    needs: fuzz-targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.list) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Fuzz for 30s
        run: go test ${{ matrix.target.pkg }} -run='^$' -fuzz='^${{ matrix.target.name }}$' -fuzztime=30s

  build-matrix:
    name: cross compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # The core has no cgo and no build tags that depend on the host, so it
      # should cross compile everywhere. When that stops being true it will be
      # a deliberate decision rather than a surprise.
      - name: Cross compile
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 js/wasm wasip1/wasm; do
            os=${target%/*}
            arch=${target#*/}
            echo "building $target"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build ./...
          done
